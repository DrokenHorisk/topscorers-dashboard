apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: topscorers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/drokenhorisk/topscorers-dashboard'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: topscorers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
