image:
  backend:
    repository: ghcr.io/drokenhorisk/topscorers-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/drokenhorisk/topscorers-frontend
    tag: latest
    pullPolicy: IfNotPresent

replicaCount:
  backend: 1
  frontend: 1

service:
  backend:
    type: ClusterIP
    port: 8080
  frontend:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: traefik
  # Hôte vide = accepte l'URL publique générée par Tailscale Funnel (*.ts.net).
  # /api est routé vers le backend, toutes les autres routes vers le frontend.
  hosts:
    - host: ""
  tls: []

backend:
  env:
    TOPS_LEAGUE_ID: "92556"
    TOPS_TEAM_ID: "506387"
    RECO_BUDGET: "10000000"
  secretsRef: topscorers-secrets
  resources:
    requests: { cpu: 200m, memory: 400Mi }
    limits:   { cpu: 500m, memory: 800Mi }

frontend:
  apiBase: ""  # même origine via l'Ingress
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 200m, memory: 256Mi }

nodeSelector: {}
tolerations: []
affinity: {}
