apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "topscorers.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "topscorers.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
{{- range $k, $v := .Values.backend.env }}
  {{ $k }}: {{ quote $v }}
{{- end }}
