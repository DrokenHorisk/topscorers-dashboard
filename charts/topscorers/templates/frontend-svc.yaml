apiVersion: v1
kind: Service
metadata:
  name: {{ include "topscorers.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "topscorers.name" . }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - name: http
      port: {{ .Values.service.frontend.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "topscorers.name" . }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
