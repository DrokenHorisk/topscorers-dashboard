apiVersion: apps/v1
kind: Deployment
metadata:
  name: topscorers-discord-bot
  namespace: topscorers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: topscorers-discord-bot
  template:
    metadata:
      labels:
        app: topscorers-discord-bot
    spec:
      containers:
      - name: bot
        image: ghcr.io/drokenhorisk/topscorers-discord-bot:latest
        imagePullPolicy: Always
        env:
          # Discord
          - name: DISCORD_TOKEN
            valueFrom:
              secretKeyRef:
                name: discord-bot-secrets
                key: DISCORD_TOKEN
          - name: DISCORD_CHANNEL_ID
            valueFrom:
              secretKeyRef:
                name: discord-bot-secrets
                key: DISCORD_CHANNEL_ID

          # TopScorers (réutilise le secret existant)
          - name: TOPS_EMAIL
            valueFrom:
              secretKeyRef:
                name: topscorers-secrets
                key: TOPS_EMAIL
          - name: TOPS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: topscorers-secrets
                key: TOPS_PASSWORD
          - name: TOPS_LEAGUE_ID
            value: "92556"

          # Persist des IDs vus
          - name: SEEN_PATH
            value: "/data/seen_transfers.json"

          # Fréquence de scan (sec)
          - name: POLL_INTERVAL_SEC
            value: "120"

        volumeMounts:
          - name: data
            mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: topscorers-data
