apiVersion: batch/v1
kind: CronJob
metadata:
  name: dashboard-generate
  namespace: topscorers
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: topscorers-dashboard-generator
            trigger: scheduled
        spec:
          restartPolicy: Never
          containers:
            - name: generate
              image: curlimages/curl:8.12.1
              imagePullPolicy: IfNotPresent
              command:
                - curl
                - --fail
                - --show-error
                - --max-time
                - "900"
                - --request
                - POST
                - http://topscorers-backend:8080/api/generate
