apiVersion: apps/v1
kind: Deployment
metadata:
  name: topscorers-discord-bot
  namespace: topscorers
  labels: { app: topscorers-discord-bot }
spec:
  replicas: 1
  selector:
    matchLabels: { app: topscorers-discord-bot }
  template:
    metadata:
      labels: { app: topscorers-discord-bot }
    spec:
      containers:
      - name: bot
        image: ghcr.io/drokenhorisk/topscorers-discord-bot:latest
        imagePullPolicy: Always
        env:
          # Discord
          - name: DISCORD_TOKEN
            valueFrom: { secretKeyRef: { name: discord-bot-secrets, key: DISCORD_TOKEN } }
          - name: DISCORD_CHANNEL_ID
            valueFrom: { secretKeyRef: { name: discord-bot-secrets, key: DISCORD_CHANNEL_ID } }
          # Scope guilde : slash-commands instantanées
          - name: DISCORD_GUILD_ID
            value: "1358465183596548298"

          # TopScorers (secrets existants)
          - name: TOPS_EMAIL
            valueFrom: { secretKeyRef: { name: topscorers-secrets, key: TOPS_EMAIL } }
          - name: TOPS_PASSWORD
            valueFrom: { secretKeyRef: { name: topscorers-secrets, key: TOPS_PASSWORD } }
          - name: TOPS_LEAGUE_ID
            value: "92556"

          # Managers / pseudos (pour /equipe & enrichissements)
          - name: OTHER_TEAM_IDS
            value: "506387,496919,472306,370769,413039,370497,370350,375986,423059"
          - name: OTHER_TEAM_NAMES
            value: "506387=Droken,496919=Traxxx76,472306=ar1312,370769=Yo,413039=al,370497=Lauz22,370350=Ice,375986=Lawn,423059=Lauri"

          # Paramètres appli
          - name: POLL_EVERY          # intervalle de scan marché (sec)
            value: "120"
          - name: BACKEND_BASE_URL
            value: "http://topscorers-backend:8080"
          - name: SEEN_PATH           # persistance des transferts déjà postés
            value: "/data/seen_transfers.json"

        volumeMounts:
          - name: data
            mountPath: /data

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: topscorers-data
