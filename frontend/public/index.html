<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c12">
  <title>TopScorers — Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090c12;
      --surface: rgba(22, 27, 38, .82);
      --surface-strong: #161b26;
      --border: rgba(255, 255, 255, .09);
      --text: #f7f8fb;
      --muted: #9ca7b9;
      --red: #d31336;
      --red-soft: rgba(211, 19, 54, .16);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 10% -10%, rgba(211, 19, 54, .2), transparent 32rem),
        radial-gradient(circle at 90% 0%, rgba(58, 95, 168, .12), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { padding: 14px; }

    .app-shell {
      width: min(1920px, 100%);
      height: calc(100vh - 28px);
      min-height: 560px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(9, 12, 18, .72);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
      backdrop-filter: blur(18px);
    }

    .topbar {
      min-height: 68px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 13px;
      background: linear-gradient(145deg, var(--red), #8f0a24);
      box-shadow: 0 8px 24px rgba(211, 19, 54, .28);
      font-size: 18px;
      font-weight: 900;
    }

    .title {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(1rem, 2vw, 1.22rem);
      font-weight: 760;
      letter-spacing: -.025em;
    }

    .subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: .76rem;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(255,255,255,.045);
      color: var(--text);
      font: inherit;
      font-size: .84rem;
      font-weight: 650;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    button:hover {
      border-color: rgba(255,255,255,.2);
      background: rgba(255,255,255,.085);
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid var(--red-soft);
      border-color: var(--red);
    }

    button.primary {
      border-color: rgba(211, 19, 54, .5);
      background: var(--red-soft);
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
      transform: none;
    }

    .content {
      position: relative;
      min-height: 0;
      padding: 8px;
    }

    .frame {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      border-radius: 14px;
      background: #0e1116;
      opacity: 0;
      transition: opacity .25s ease;
    }

    .frame.ready { opacity: 1; }

    .state {
      position: absolute;
      inset: 8px;
      z-index: 2;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #0e1116;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .state.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .state-card {
      max-width: 460px;
      padding: 30px;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .state-title {
      margin: 0 0 7px;
      font-size: 1rem;
      font-weight: 720;
    }

    .state-message {
      margin: 0;
      color: var(--muted);
      font-size: .86rem;
      line-height: 1.55;
    }

    .error .spinner {
      display: grid;
      place-items: center;
      border: 1px solid rgba(211, 19, 54, .35);
      background: var(--red-soft);
      animation: none;
    }

    .error .spinner::after {
      content: "!";
      color: #ff718c;
      font-weight: 900;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 680px) {
      body { padding: 0; }

      .app-shell {
        height: 100dvh;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
      }

      .topbar {
        min-height: 60px;
        padding: 9px 10px;
      }

      .mark {
        width: 36px;
        height: 36px;
        border-radius: 11px;
      }

      .subtitle, .button-label { display: none; }
      button { width: 40px; padding: 0; }
      .content { padding: 0; }
      .frame, .state { border-radius: 0; }
      .state { inset: 0; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="identity">
        <div class="mark" aria-hidden="true">TS</div>
        <div>
          <h1 class="title">TopScorers Dashboard</h1>
          <div class="subtitle" id="lastUpdate">Analyse du marché et recommandations</div>
        </div>
      </div>

      <div class="actions">
        <button id="openButton" type="button" title="Ouvrir le dashboard dans un nouvel onglet" disabled>
          ↗ <span class="button-label">Ouvrir</span>
        </button>
        <button id="refreshButton" class="primary" type="button" title="Actualiser les données">
          ↻ <span class="button-label">Actualiser</span>
        </button>
      </div>
    </header>

    <section class="content">
      <div id="state" class="state" role="status" aria-live="polite">
        <div class="state-card">
          <div class="spinner" aria-hidden="true"></div>
          <p id="stateTitle" class="state-title">Chargement du marché…</p>
          <p id="stateMessage" class="state-message">Récupération des données TopScorers et préparation du dashboard.</p>
        </div>
      </div>
      <iframe id="frame" class="frame" title="Dashboard TopScorers"></iframe>
    </section>
  </main>

  <script>
    const API = localStorage.getItem('API_BASE') || '';
    const frame = document.getElementById('frame');
    const state = document.getElementById('state');
    const stateTitle = document.getElementById('stateTitle');
    const stateMessage = document.getElementById('stateMessage');
    const refreshButton = document.getElementById('refreshButton');
    const openButton = document.getElementById('openButton');
    const lastUpdate = document.getElementById('lastUpdate');
    let dashboardUrl = null;

    const dashboardStyles = `
      <style id="topscorers-modern-ui">
        :root {
          --lhc-bg: #0b0e14 !important;
          --lhc-card: #151a24 !important;
          --lhc-muted: #9da8ba !important;
          --row-border: rgba(255,255,255,.09) !important;
        }

        html { scroll-behavior: smooth; }

        body {
          min-height: 100vh;
          padding: 18px 20px 34px !important;
          background:
            radial-gradient(circle at 7% 0%, rgba(200,16,46,.13), transparent 30rem),
            radial-gradient(circle at 94% 5%, rgba(57,93,166,.09), transparent 27rem),
            var(--lhc-bg) !important;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container-fluid {
          width: min(1760px, 100%);
          margin-inline: auto;
          padding: 0 !important;
        }

        .brand-logo {
          width: 48px !important;
          height: 48px !important;
          border: 1px solid rgba(255,255,255,.14) !important;
          border-radius: 15px !important;
          box-shadow: 0 10px 30px rgba(0,0,0,.28) !important;
        }

        .brand-title {
          color: #fff !important;
          font-weight: 780 !important;
          letter-spacing: -.035em;
        }

        .brand-title::after {
          content: "";
          display: inline-block;
          width: 8px;
          height: 8px;
          margin-left: 10px;
          border-radius: 50%;
          background: var(--lhc-red);
          box-shadow: 0 0 0 5px rgba(200,16,46,.13);
          vertical-align: .18em;
        }

        .nav-tabs {
          position: sticky;
          top: 0;
          z-index: 20;
          gap: 6px;
          padding: 8px;
          overflow-x: auto;
          flex-wrap: nowrap !important;
          border: 1px solid var(--row-border) !important;
          border-radius: 15px;
          background: rgba(15,19,28,.88);
          box-shadow: 0 12px 32px rgba(0,0,0,.2);
          backdrop-filter: blur(16px);
          scrollbar-width: thin;
        }

        .nav-tabs .nav-item { flex: 0 0 auto; }

        .nav-tabs .nav-link {
          border: 1px solid transparent !important;
          border-radius: 10px !important;
          padding: .55rem .82rem;
          font-size: .86rem;
          font-weight: 650;
          white-space: nowrap;
          transition: background .18s ease, color .18s ease, transform .18s ease;
        }

        .nav-tabs .nav-link:hover {
          color: #fff !important;
          background: rgba(255,255,255,.055);
        }

        .nav-tabs .nav-link.active {
          background: linear-gradient(135deg, #d31336, #a90c29) !important;
          box-shadow: 0 7px 20px rgba(200,16,46,.25);
        }

        .card {
          overflow: hidden;
          border-color: var(--row-border) !important;
          border-radius: 16px !important;
          background: rgba(21,26,36,.88) !important;
          box-shadow: 0 14px 42px rgba(0,0,0,.18);
        }

        .table-wrapper {
          border: 1px solid var(--row-border);
          border-radius: 13px;
          background: rgba(8,11,17,.42);
        }

        .table {
          margin-bottom: 0 !important;
          font-size: .86rem;
        }

        .table thead {
          position: sticky;
          top: 0;
          z-index: 3;
        }

        .table th {
          padding: .72rem .68rem !important;
          border-bottom-width: 1px !important;
          background: #111620 !important;
          font-size: .72rem;
          letter-spacing: .035em;
          text-transform: uppercase;
          white-space: nowrap;
        }

        .table td {
          padding: .62rem .68rem !important;
          border-color: rgba(255,255,255,.055) !important;
        }

        .table tbody tr {
          transition: background .15s ease;
        }

        .table tbody tr:nth-child(even):not(.score-mustbuy) td {
          background: rgba(255,255,255,.018);
        }

        .table tbody tr:hover:not(.score-mustbuy) td {
          background: rgba(255,255,255,.055) !important;
        }

        .table .score-mustbuy td {
          background: linear-gradient(90deg, #b9f5d4, #d9fbe8) !important;
        }

        input.form-control-sm, select.form-select-sm {
          min-height: 38px;
          border-radius: 10px !important;
          background: #0d121a !important;
        }

        .btn {
          border-radius: 10px !important;
          font-weight: 620;
        }

        .statcard {
          border-radius: 14px !important;
          background: linear-gradient(145deg, rgba(255,255,255,.04), rgba(255,255,255,.01)) !important;
        }

        .modal-content {
          box-shadow: 0 28px 90px rgba(0,0,0,.55);
        }

        @media (max-width: 768px) {
          body { padding: 12px 10px 24px !important; }

          .brand-logo {
            width: 40px !important;
            height: 40px !important;
          }

          .brand-title {
            font-size: 1.1rem !important;
          }

          .nav-tabs {
            margin-inline: -2px;
            padding: 6px;
            border-radius: 12px;
          }

          .nav-tabs .nav-link {
            padding: .48rem .68rem;
            font-size: .8rem;
          }

          .table { font-size: .78rem; }
          .table th, .table td { padding: .52rem .56rem !important; }
        }
      </style>
    `;

    function setLoading() {
      state.classList.remove('hidden', 'error');
      frame.classList.remove('ready');
      stateTitle.textContent = 'Chargement du marché…';
      stateMessage.textContent = 'Récupération des données TopScorers et préparation du dashboard.';
      refreshButton.disabled = true;
    }

    function setError(error) {
      state.classList.remove('hidden');
      state.classList.add('error');
      stateTitle.textContent = 'Impossible de charger le dashboard';
      stateMessage.textContent = error instanceof Error ? error.message : String(error);
      refreshButton.disabled = false;
    }

    async function loadDashboard() {
      setLoading();

      try {
        const response = await fetch(API + '/api/dashboard', {
          headers: { 'Accept': 'text/html' },
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error('Le serveur a répondu avec le statut HTTP ' + response.status + '.');
        }

        let html = await response.text();
        html = html.includes('</head>')
          ? html.replace('</head>', dashboardStyles + '</head>')
          : dashboardStyles + html;

        if (dashboardUrl) URL.revokeObjectURL(dashboardUrl);
        dashboardUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));

        frame.onload = () => {
          state.classList.add('hidden');
          frame.classList.add('ready');
          refreshButton.disabled = false;
          openButton.disabled = false;
          lastUpdate.textContent = 'Actualisé à ' + new Intl.DateTimeFormat('fr-FR', {
            hour: '2-digit',
            minute: '2-digit',
            day: '2-digit',
            month: 'short'
          }).format(new Date());
        };

        frame.src = dashboardUrl;
      } catch (error) {
        setError(error);
      }
    }

    refreshButton.addEventListener('click', loadDashboard);
    openButton.addEventListener('click', () => {
      if (dashboardUrl) window.open(dashboardUrl, '_blank', 'noopener,noreferrer');
    });
    window.addEventListener('beforeunload', () => {
      if (dashboardUrl) URL.revokeObjectURL(dashboardUrl);
    });

    loadDashboard();
  </script>
</body>
</html>
