name: Build and deploy backend image

on:
  push:
    branches: ["feat/k8s-argocd"]
    paths:
      - "topscorers_dashboard.py"
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-image-k8s
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Test recommendation engine
        run: python -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/drokenhorisk/topscorers-backend:latest
            ghcr.io/drokenhorisk/topscorers-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin image for Argo CD
        env:
          IMAGE: ghcr.io/drokenhorisk/topscorers-backend:${{ github.sha }}
        run: |
          sed -i -E "s|image: ghcr.io/drokenhorisk/topscorers-backend:[^[:space:]]+|image: ${IMAGE}|" k8s/deployment-backend.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- k8s/deployment-backend.yaml
          git diff --cached --quiet || git commit -m "deploy: pin backend image ${GITHUB_SHA}"
          git push
